# Server
server.port=8081

# MySQL (default)
spring.datasource.url=jdbc:mysql://localhost:3306/smart_job_portal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway owns schema creation and versioned seed data
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration,classpath:db/migration-mysql

# JWT
jwt.secret=${JWT_SECRET:dev-only-change-this-secret-before-production-use-1234567890}
jwt.expiration-ms=86400000

# AWS S3
aws.s3.bucket-name=smart-job-portal-resumes
aws.s3.region=us-east-1
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email (optional - leave commented for dev, emails will be logged only)
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your-email@gmail.com
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# app.email.enabled=true

# Spring AI Gemini screening (optional; ranking falls back to keyword matching when unset)
spring.ai.google.genai.api-key=${GEMINI_API_KEY:local-disabled-key}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.temperature=0.1
spring.ai.google.genai.chat.response-mime-type=application/json

